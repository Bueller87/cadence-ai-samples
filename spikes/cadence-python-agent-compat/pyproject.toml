[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence-python-agent-compat-spike"
version = "0.0.0"
description = "Removable compatibility spike for Cadence Python agent integrations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cadence-python-client==0.4.0",
    "google-adk==2.1.0",
    "openai==2.30.0",
    "openai-agents==0.12.5",
    "pydantic==2.12.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]
ollama = ["litellm==1.83.7"]

[tool.setuptools]
py-modules = ["compatibility_spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
