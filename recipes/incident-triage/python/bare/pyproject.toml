[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-triage"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cadence-python-client==0.4.1",
    "pydantic==2.12.5",
]

[tool.setuptools]
py-modules = [
    "activities",
    "check_clean_copy",
    "durability_manifest",
    "live_model",
    "main",
    "raw_agent",
    "run_compare",
    "run_rehearsal",
    "run_variants",
    "story",
    "verify_comparisons",
    "worker",
    "workflow",
]
