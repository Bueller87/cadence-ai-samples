name: General work proposal
description: Share an idea for maintainer triage before implementation-task authoring
title: ""
labels:
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this format for a general idea that is not yet an implementation-ready task.
        Maintainer triage may later choose a human-first or agent-first task format.
        Proposals are not approved work until a human maintainer adds `status:ready`.
        Missing format, type, area, or source labels never authorize implementation.
        Do not include credentials, proprietary data, or private company context.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Explorer
        - Recipes
        - Templates
        - Catalogs
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea or problem
      description: What idea, opportunity, or concrete problem should maintainers consider?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link relevant public references, repository paths, Issues, or PRs.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Desired value
      description: Who would benefit, and what useful outcome would this make possible?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Known constraints or open questions
      description: Record important boundaries, dependencies, or decisions that still need triage.
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Approval gate
      options:
        - label: I understand that only a human maintainer may label this proposal `status:ready` before implementation.
          required: true
