name: Recipe proposal
description: Propose a new recipe or port for maintainer triage
title: "[Recipe]: "
labels:
  - status:needs-triage
  - type:recipe
  - area:recipes
body:
  - type: markdown
    attributes:
      value: |
        Recipe proposals use specialized intake and remain format-neutral until maintainer triage.
        Every open Issue has exactly one lifecycle label: `status:needs-triage`,
        `status:ready`, or `status:in-progress`. A maintainer approves a proposal by
        replacing `status:needs-triage` with `status:ready`, never adding a second state.
        Missing format, type, area, or source labels never authorize implementation.
        Do not include credentials, proprietary data, or private company context.
  - type: dropdown
    id: contribution_kind
    attributes:
      label: Contribution kind
      options:
        - New recipe
        - Port of a public sample
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and business scenario
      description: Who uses this agent, what does it produce, and what should they see when it works? Name the inputs and one failure it should recover from.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source reference
      description: For a port, link the public source repository or sample.
  - type: dropdown
    id: language
    attributes:
      label: Cadence language
      options:
        - Go
        - Python
        - Java
        - Other or undecided
    validations:
      required: true
  - type: dropdown
    id: classifier
    attributes:
      label: Classifier integration
      options:
        - None
        - SystemOne
        - Other or undecided
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent integration
      options:
        - None
        - Google ADK
        - OpenAI Agents
        - Other or undecided
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Choose one useful result and one recovery behavior for the first version. State what is outside that scope.
    validations:
      required: true
  - type: textarea
    id: mock_path
    attributes:
      label: Offline or mock path
      description: Explain how the core behavior can be exercised without paid AI access.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Canonical or intended specification path
      description: Link an existing spec, or give the intended `recipes/<slug>/SPEC.md` path for a new recipe.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe the starting behavior, controlled failure and visible recovery. State what Cadence preserves and what your application must handle.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: List the offline tests, mock walkthrough, and any separately approved live checks.
    validations:
      required: true
  - type: checkboxes
    id: approval
    attributes:
      label: Approval gate
      options:
        - label: I understand that only a human maintainer may label this proposal `status:ready` before implementation.
          required: true
